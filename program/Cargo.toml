[package]
name = "program"
version = "0.1.0"
edition = "2021"

[features]
custom-heap = []
custom-panic = []

[lib]
crate-type = ["cdylib"]

[dependencies]
solana-account-info = "2.3.0"
solana-program-error-legacy = { package = "solana-program-error", version = "2.2.2" }
solana-program-error = "3.0.1"
solana-program-entrypoint = "2.3.0"
solana-pubkey = "2.4.0"
solana-falcon512 = { path = ".." }

[dev-dependencies]
mollusk-svm = "0.12.0"
solana-account = "3.4.0"
solana-instruction = "3.4.0"
solana-address = "2.6.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
